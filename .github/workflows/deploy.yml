name: Deploy to GitHub Pages

on:
  # Roda a action toda vez que houver um push na branch main
  push:
    branches: ["main"]

  # Permite rodar manualmente a partir da aba Actions
  workflow_dispatch:

# Permissoes necessarias para o GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy concorrente por vez
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Instalar dependencias
        run: npm ci
        
      - name: Fazer o Build
        run: npm run build
        
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4
        
      - name: Fazer upload dos artefatos
        uses: actions/upload-pages-artifact@v3
        with:
          # O Vite gera a pasta dist por padrao
          path: './dist'
          
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
